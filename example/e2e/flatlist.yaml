# FlatList: dragging the thumb to the bottom reaches the last letter; back to the top, "A" again.
# Expo Go: host.exp.Exponent on iOS; npm run e2e:android sets APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: FlatList
- assertVisible: Ada Abby
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/drag-to-end.yaml
          env:
            TOP: 31 # below the pinned header
      - assertVisible: '.* Zel.*'
- assertNotVisible: Ada Abby
- retry:
    maxRetries: 1
    commands:
      - runFlow: subflows/drag-to-start.yaml
      - assertVisible: Ada Abby
