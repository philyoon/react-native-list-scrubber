# FlatList: dragging the handle to the bottom reaches the last letter; to the top, back to "A".
# Coordinates: the handle sits at the card's right edge (93%); the list spans roughly 22%–97% of the screen.
appId: host.exp.Exponent
---
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: FlatList
- assertVisible: Ada Abby
- runFlow: subflows/show-handle.yaml
- swipe:
    start: 93%, 25%
    end: 93%, 98%
    duration: 1500
- waitForAnimationToEnd
- assertVisible: '.* Zel.*'
- assertNotVisible: Ada Abby
- runFlow: subflows/show-handle.yaml
- swipe:
    start: 93%, 94%
    end: 93%, 20%
    duration: 1500
- waitForAnimationToEnd
- assertVisible: Ada Abby
