# Screen readers get an adjustable "Scroll position" control, present even while the thumb is hidden.
# Expo Go: host.exp.Exponent on iOS; on Android run with -e APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: FlatList
- assertVisible:
    id: list-scrubber-a11y
# Android reads the label and the value together ("Scroll position, A")
- assertVisible: 'Scroll position.*'
