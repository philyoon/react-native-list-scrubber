# While the thumb is hidden, a swipe on its strip scrolls the list instead of grabbing the thumb.
# Expo Go: host.exp.Exponent on iOS; npm run e2e:android sets APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: FlatList
# Along the thumb's strip, from its bottom to halfway up: an ordinary scroll
- swipe:
    start: 91%, 95%
    end: 91%, 50%
    duration: 400
- waitForAnimationToEnd
- assertNotVisible: Ada Abby
- assertNotVisible: '.* Zel.*' # a normal scroll, not a jump to the end
