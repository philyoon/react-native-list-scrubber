# SectionList, FlashList and Legend List: the thumb reaches the end of each list, and on FlashList, whose
# positions are estimates until rows are measured, comes back to the start.
# Expo Go: host.exp.Exponent on iOS; npm run e2e:android sets APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: SectionList
- retry:
    maxRetries: 1
    commands:
      - runFlow: subflows/drag-to-end.yaml
      - assertVisible: '.* Zel.*'
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: FlashList
- assertVisible: 'Mon, Oct 5'
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/drag-to-end.yaml
          env:
            TOP: 31 # below the pinned header
      - assertNotVisible: 'Mon, Oct 5'
# Rows show no year; the screen reader value does, once the thumb hides (5 s in e2e mode)
- extendedWaitUntil:
    visible:
      id: list-scrubber-a11y
      text: '.*202[0-3].*'
    timeout: 10000
- retry:
    maxRetries: 1
    commands:
      - runFlow: subflows/drag-to-start.yaml
      - assertVisible: 'Mon, Oct 5'
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: Legend List
- assertVisible: 'Scroll position.*' # Android adds the value
# Rows show no year; the screen reader value does, once the thumb hides (5 s in e2e mode)
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          file: subflows/drag-to-end.yaml
          env:
            TOP: 31 # below the pinned header
      - extendedWaitUntil:
          visible:
            id: list-scrubber-a11y
            text: '.*202[0-3].*'
          timeout: 10000
