# SectionList, FlashList and Legend List: the thumb reaches the end of each list.
# Expo Go: host.exp.Exponent on iOS; npm run e2e:android sets APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: SectionList
- runFlow: subflows/drag-to-end.yaml
- assertVisible: '.* Zel.*'
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: Legend List
- assertVisible: 'Scroll position.*' # Android adds the value
- runFlow: subflows/drag-to-end.yaml
# Rows show no year; the screen reader value does, once the thumb hides (5 s in e2e mode)
- extendedWaitUntil:
    visible:
      id: list-scrubber-a11y
      text: '.*202[0-3].*'
    timeout: 10000
