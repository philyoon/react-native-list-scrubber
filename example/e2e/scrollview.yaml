# ScrollView: the handle reaches the last chapter and comes back to the first.
# Expo Go: host.exp.Exponent on iOS; on Android run with -e APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- runFlow:
    file: subflows/open.yaml
    env:
      DEMO: ScrollView
- assertVisible: Chapter 1
- runFlow: subflows/drag-to-end.yaml
- assertVisible: Chapter 60
- runFlow: subflows/drag-to-start.yaml
- assertVisible: Chapter 1
