# Shows the handle, then drags it from the bottom of its track (where drag-to-end left it) to above the
# list: it clamps at the start. Points: see src/e2e.ts.
# Expo Go: host.exp.Exponent on iOS; on Android run with -e APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- swipe:
    start: 50%, 56%
    end: 50%, 60%
    duration: 800 # slow: no fling still moving the list when the handle is grabbed
- swipe:
    start: 91%, 95%
    end: 91%, 5%
    duration: 1500
- waitForAnimationToEnd
