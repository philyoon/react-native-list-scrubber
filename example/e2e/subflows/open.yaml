# Opens the example in Expo Go (Metro must be running: npm start) on the demo tab named DEMO.
appId: host.exp.Exponent
---
# Fresh start: Expo Go keeps the last tab and scroll positions otherwise
- stopApp
- openLink: exp://127.0.0.1:8081
- extendedWaitUntil:
    visible: List Scrubber
    timeout: 60000
# The tabs scroll sideways and later ones start off screen: swipe the tab row (16% down) to its end
- runFlow:
    when:
      notVisible:
        id: demo-${DEMO}
    commands:
      - swipe:
          start: 90%, 16%
          end: 10%, 16%
          duration: 400
- tapOn:
    id: demo-${DEMO}
