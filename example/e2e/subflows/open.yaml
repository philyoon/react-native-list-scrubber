# Opens the example in Expo Go (Metro must be running: npm run e2e:start, or e2e:start:rtl for e2e/rtl) on the
# demo named DEMO. Expo Go must be past its first-run screens: scripts/e2e.sh runs e2e/setup/expo-go.yaml first.
# Every step waits for something that is there: Maestro takes about 7 s to decide something isn't.
# Expo Go: host.exp.Exponent on iOS; npm run e2e:android sets APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
# Portrait, whatever an earlier flow left (landscape.yaml turns the phone after opening)
- setOrientation: PORTRAIT
# Fresh start (stopApp, not killApp: on Android killApp leaves Expo Go running), so a failed flow can't leave
# the next one on an error screen, scrolled, or in the wrong layout direction (src/e2e.ts sets it as the app
# loads)
- stopApp
- openLink: exp://127.0.0.1:8081/--/?demo=${DEMO}
- extendedWaitUntil:
    visible:
      id: list-scrubber-a11y
    timeout: 60000
# The link picks the demo; each flow then checks that demo's content (later tabs are off screen)
- waitForAnimationToEnd
