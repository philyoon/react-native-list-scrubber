# Shows the thumb (it appears only after the list scrolls), then drags it from the top of its track to
# past the bottom of the screen: it clamps at the end. Points: see src/e2e.ts.
# Expo Go: host.exp.Exponent on iOS; on Android run with -e APP_ID=host.exp.exponent
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- swipe:
    start: 50%, 60%
    end: 50%, 56%
    duration: 800 # slow: no fling still moving the list when the thumb is grabbed
- swipe:
    start: 91%, 28%
    end: 91%, 99%
    duration: 1500
- waitForAnimationToEnd
