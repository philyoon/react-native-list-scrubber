# Shows the thumb (it appears only after the list scrolls), then drags it from the top of its track to
# past the bottom of the screen: it clamps at the end. Points: see src/e2e.ts.
# Callers retry the drag along with their check of where it ended: GitHub's iOS simulator now and then
# drops a gesture.
# Expo Go: host.exp.Exponent on iOS; npm run e2e:android sets APP_ID=host.exp.exponent
# RTL: 1 for a right-to-left layout, with the thumb at the left edge (x 9%, not 91%).
# TOP: where the thumb's track starts, as a percentage of the screen's height (default 28): 31 below a pinned
# header that takes its own space (FlatList, FlashList, Legend List), 39 for that in landscape.
# Neither is given a default below: a subflow's own env wins over the caller's.
appId: ${APP_ID}
env:
  APP_ID: host.exp.Exponent
---
- swipe:
    start: 50%, 60%
    end: 50%, 56%
    duration: 800 # slow: no fling still moving the list when the thumb is grabbed
- runFlow:
    when:
      true: ${!(typeof RTL != 'undefined' && RTL == 1)}
    commands:
      - swipe:
          start: 91%, ${typeof TOP == 'undefined' ? 28 : TOP}%
          end: 91%, 99%
          duration: 1500 # it ends at the end of the list: on a slow emulator (CI) a faster drag's last stretch can be lost
- runFlow:
    when:
      true: ${typeof RTL != 'undefined' && RTL == 1}
    commands:
      - swipe:
          start: 9%, ${typeof TOP == 'undefined' ? 28 : TOP}%
          end: 9%, 99%
          duration: 1500 # it ends at the end of the list: on a slow emulator (CI) a faster drag's last stretch can be lost
- waitForAnimationToEnd
