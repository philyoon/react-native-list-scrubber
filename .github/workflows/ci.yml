name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build
      # The package as users get it: entry points, built imports, and an app typechecking against it
      - run: npm run smoke:package
      - run: npm --prefix example install
      - run: npm --prefix example run typecheck
      # Builds the example for web: catches anything that breaks the web bundle
      - run: npm --prefix example run export:web
  # The oldest versions the peer dependency ranges allow: the library's source and an app using every export
  # must still typecheck against them. (The unit tests need newer Reanimated/Worklets Jest support, so they run
  # in the job above only.)
  min-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/install-min-peers.mjs
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npm run smoke:package
