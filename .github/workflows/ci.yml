name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The installed Reanimated must list the installed React Native and Worklets as compatible
      - run: node scripts/check-reanimated-compat.mjs
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      - run: npm run build
      # The package as users get it: entry points, built imports, and an app typechecking against it
      - run: npm run smoke:package
      - run: npm --prefix example install
      - run: npm --prefix example run typecheck
      # Builds the example for web and drives it in a browser (example/web-e2e): drags, the bubble's layout
      # in left-to-right and right-to-left pages, the keyboard, and no console warnings
      - run: npm --prefix example exec -- playwright install --with-deps chromium
      - run: npm --prefix example run web:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-e2e-traces
          path: example/test-results
  # The oldest versions the peer dependency ranges allow: a pair Reanimated supports, the library's types, the
  # unit tests, and an app using every export must all still work with them.
  min-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/install-min-peers.mjs
      - run: node scripts/check-reanimated-compat.mjs
      - run: npx tsc --noEmit -p tsconfig.build.json
      - run: npm test -- --coverage
      - run: npm run smoke:package
