name: Release
# Publishes to npm and creates the GitHub Release when a version tag is pushed: git tag v0.1.0 && git push origin v0.1.0
# Uses npm trusted publishing: npm trusts this workflow (set up in the package's settings on npmjs.com) and gives
# it a short-lived credential per run, so there's no npm token to store. npm adds provenance on its own.
on:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates the GitHub Release
      id-token: write # trusted publishing: lets the run prove to npm which repo and workflow it is
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 bundles npm 10
      - run: npm install -g npm@^11.5.1
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}" >&2
            exit 1
          fi
      # Before anything is published: the release needs notes
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/release-notes.md"
      - run: npm ci
      - run: node scripts/check-reanimated-compat.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage
      # Packs the package (prepare builds it) and checks it as users get it
      - run: npm run smoke:package
      # Skipped when the version is already on npm, e.g. a first version published by hand (see CONTRIBUTING)
      - name: Publish
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "react-native-list-scrubber@${version}" version >/dev/null 2>&1; then
            echo "react-native-list-scrubber@${version} is already on npm; nothing to publish"
          else
            npm publish --access public
          fi
      # Skipped when the release already exists, e.g. one created by hand
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "The GitHub Release ${GITHUB_REF_NAME} already exists; nothing to create"
          else
            gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file "${RUNNER_TEMP}/release-notes.md" --verify-tag
          fi
