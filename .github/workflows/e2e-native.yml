name: Native e2e
# The Maestro flows in example/e2e (all but the right-to-left ones, and landscape on iOS) on an iOS simulator and
# an Android emulator, in the example built as a release app of its own (scripts/e2e-build.sh): no Metro, no Expo
# Go. iOS builds the app and runs every flow in one job; Android builds it once, then three groups of flows run
# side by side on it.
# Caches: npm, CocoaPods' downloads, Xcode's build folder (irgaly/xcode-cache), Gradle, Maestro, and the
# emulator's boot snapshot. The build caches (over 1 GB each) are saved by main's runs and manual ones only, so
# pull requests don't fill the repository's 10 GB of cache and evict the others; a cache key can't be
# overwritten, so each save's key ends in its run ID or commit, and a run restores the newest match.
on:
  pull_request:
  # On main too: a pull request can only use caches saved by its own runs or by main's, so main's runs keep them
  # warm for every pull request
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: true
env:
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_VERSION: 2.11.0
  # The first start of Maestro's driver on a fresh simulator or emulator can be slow
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
  E2E_APP: build
  # A flow that fails runs once more (only the flows that failed): on the slow CI simulators a flow sometimes fails
  # on timing alone (a drag lands short, an app launch outlasts a wait) and passes the second time; a real failure
  # fails both times. Every run's Maestro output stays in ~/.maestro/tests for the artifact.
  E2E_RETRIES: 1
jobs:
  # iOS in one job: it builds the app, then runs every flow on it. macOS runners are scarce (GitHub runs at most 5
  # at a time per account), and separate test jobs waited minutes for one, then spent about 6 min each on setup.
  # The simulator boots while the app builds.
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Start booting an iPhone Pro simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
             | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid')
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          echo "MAESTRO_DEVICE=$udid" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm --prefix example ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        id: maestro-cache
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # CocoaPods' downloads, under the inputs expo prebuild generates the Podfile from (Podfile.lock doesn't exist
      # until then)
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ hashFiles('example/package-lock.json', 'example/app.json') }}
          restore-keys: cocoapods-
      - run: echo "XCODE=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_ENV"
      # ExpoModulesJSI's framework, built into node_modules by a build phase (about 1 min), which npm ci removes.
      # The build script skips slices whose source hash matches.
      - uses: actions/cache/restore@v4
        with:
          path: &jsi-cache example/node_modules/expo-modules-jsi/apple/Products
          key: expo-jsi-${{ env.XCODE }}-${{ hashFiles('example/package-lock.json') }}
      # Generates ios/ (expo prebuild deletes and recreates it) and installs the pods
      - run: E2E_BUILD_STEP=prepare sh scripts/e2e-build.sh ios
        working-directory: example
      # Xcode's build folder, kept outside ios/ for that reason, with the timestamps of the files it was built from:
      # npm ci and prebuild give every file a new one, which alone would make Xcode rebuild everything. The action
      # puts a file's old timestamp back when its content is unchanged, so it runs once the generated files exist.
      # Saved (when the job succeeds) by main's and manual runs, not by pull requests', like the Gradle cache.
      - uses: irgaly/xcode-cache@4141f139f00e335c6e1031fb93e667181f86146f # v1.9.2
        with:
          key: xcode-deriveddata-${{ env.XCODE }}-${{ github.sha }}
          restore-keys: xcode-deriveddata-${{ env.XCODE }}-
          deriveddata-directory: ${{ runner.temp }}/DerivedData
          restore-mtime-targets: |
            example/ios/**/*
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - run: E2E_BUILD_STEP=compile sh scripts/e2e-build.sh ios
        working-directory: example
        env:
          NO_INSTALL: 1
          E2E_DERIVED_DATA: ${{ runner.temp }}/DerivedData
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: *jsi-cache
          key: expo-jsi-${{ env.XCODE }}-${{ hashFiles('example/package-lock.json') }}
      - name: Install the app
        run: |
          xcrun simctl bootstatus "$MAESTRO_DEVICE" -b
          app=$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/ListScrubber.app
          xcrun simctl install "$MAESTRO_DEVICE" "$app"
        working-directory: example
      # Not landscape.yaml on iOS: after a rotation, GitHub's macOS simulator lost Maestro's touches in the lower
      # part of the screen, in that flow and the ones after it (they pass locally on the same simulator model). It
      # runs on Android here, and on iOS locally (npm run e2e:ios).
      - run:
          sh scripts/e2e.sh ios e2e/lists.yaml e2e/passthrough.yaml e2e/collapsible.yaml e2e/flatlist.yaml
          e2e/middle.yaml e2e/scrollview.yaml e2e/index.yaml e2e/accessibility.yaml e2e/large-text
        working-directory: example
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ios
          path: ~/.maestro/tests

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm --prefix example ci
      # Gradle's downloads and its build cache (e2e-build.sh builds with --build-cache), under the native inputs
      - uses: actions/cache/restore@v4
        with:
          path: &gradle-cache |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-
          restore-keys: |
            android-gradle-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-
            android-gradle-
      - run: NO_INSTALL=1 sh scripts/e2e-build.sh android
        working-directory: example
        env:
          # The CI emulator's architecture only
          ANDROID_ARCH: x86_64
      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request'
        with:
          path: *gradle-cache
          key:
            android-gradle-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-${{ github.run_id
            }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: example/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  android:
    name: android (${{ matrix.shard.name }})
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The flows in three groups that run side by side, of about equal length on CI
      matrix:
        shard:
          - name: lists
            flows: e2e/lists.yaml e2e/passthrough.yaml
          - name: drags
            flows: e2e/collapsible.yaml e2e/flatlist.yaml e2e/middle.yaml
          - name: more
            flows: e2e/landscape.yaml e2e/scrollview.yaml e2e/index.yaml e2e/accessibility.yaml e2e/large-text
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: maestro-cache
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: android-app
          path: example
      # The emulator boots from a snapshot kept between runs (the emulator action's recommended setup)
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_7
      - name: Create the emulator and its boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Created the emulator's boot snapshot"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DEVICE: emulator-5554
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          # Animations stay on, as on a phone: with them off, Reanimated treats the device as reduced-motion
          disable-animations: false
          emulator-options:
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: example
          # Each line runs in its own shell
          script: |
            adb install -r app-release.apk
            sh scripts/e2e.sh android ${{ matrix.shard.flows }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-android-${{ matrix.shard.name }}
          path: ~/.maestro/tests
