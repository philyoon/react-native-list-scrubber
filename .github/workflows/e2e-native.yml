name: Native e2e
# The Maestro flows in example/e2e (all but the right-to-left ones, and landscape on iOS) in Expo Go, on an iOS
# simulator and an Android emulator: the same runs as `npm run e2e:ios` / `npm run e2e:android` (see the README's End-to-end tests)
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: true
env:
  MAESTRO_CLI_NO_ANALYTICS: 1
  # The first start of Maestro's driver on a fresh simulator or emulator can be slow
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
jobs:
  ios:
    name: ios (${{ matrix.shard.name }})
    runs-on: macos-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # The flows in three groups that run side by side, of about equal length on CI
      matrix:
        shard:
          - name: lists
            flows: e2e/lists.yaml e2e/passthrough.yaml
          - name: drags
            flows: e2e/collapsible.yaml e2e/flatlist.yaml e2e/middle.yaml
          # Not landscape.yaml on iOS: after a rotation, GitHub's macOS simulator lost Maestro's touches in the
          # lower part of the screen, in that flow and the ones after it (they pass locally on the same simulator
          # model). It runs on Android here, and on iOS locally (npm run e2e:ios).
          - name: more
            flows: e2e/scrollview.yaml e2e/index.yaml e2e/accessibility.yaml e2e/large-text
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm --prefix example ci
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      # The simulator boots (about 1.5 min) while Expo Go is fetched and Metro builds the app. Not during the
      # dependency install: on the runner the two slowed each other down, npm ci from 20 s to 4 min
      - name: Start booting an iPhone Pro simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
             | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid')
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          echo "MAESTRO_DEVICE=$udid" >> "$GITHUB_ENV"
      # Expo Go (about 200 MB) is kept between runs, under its download URL: a new Expo Go is fetched once
      - name: Expo Go's download URL
        id: expo-go
        run: |
          url=$(node scripts/expo-go-url.mjs ios)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "key=$(printf %s "$url" | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
        working-directory: example
      - uses: actions/cache@v4
        id: expo-go-cache
        with:
          path: example/ExpoGo.app
          key: expo-go-ios-${{ steps.expo-go.outputs.key }}
      - name: Download Expo Go
        if: steps.expo-go-cache.outputs.cache-hit != 'true'
        run: |
          mkdir ExpoGo.app
          curl -fsSL "${{ steps.expo-go.outputs.url }}" | tar -xz -C ExpoGo.app
        working-directory: example
      - name: Start Metro in e2e mode, and install Expo Go meanwhile
        run: |
          sh scripts/ci-metro.sh ios &
          metro=$!
          xcrun simctl bootstatus "$MAESTRO_DEVICE" -b
          xcrun simctl install "$MAESTRO_DEVICE" ExpoGo.app
          wait "$metro"
        working-directory: example
      # Once more if it fails: on the slow CI simulator a flow sometimes fails on timing alone (a drag lands short,
      # an app launch outlasts a wait) and passes on a rerun; a real failure fails both times. Both runs' Maestro
      # output stays in ~/.maestro/tests for the artifact.
      - run: npm run e2e:ios -- ${{ matrix.shard.flows }} || npm run e2e:ios -- ${{ matrix.shard.flows }}
        working-directory: example
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ios-${{ matrix.shard.name }}
          path: |
            ~/.maestro/tests
            example/metro.log

  android:
    name: android (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # The flows in three groups that run side by side, of about equal length on CI
      matrix:
        shard:
          - name: lists
            flows: e2e/lists.yaml e2e/passthrough.yaml
          - name: drags
            flows: e2e/collapsible.yaml e2e/flatlist.yaml e2e/middle.yaml
          - name: more
            flows: e2e/landscape.yaml e2e/scrollview.yaml e2e/index.yaml e2e/accessibility.yaml e2e/large-text
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: npm --prefix example ci
      - name: Install Maestro
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Download Expo Go
        run: |
          url=$(node scripts/expo-go-url.mjs android)
          curl -fsSL "$url" -o expo-go.apk
        working-directory: example
      - name: Start Metro in e2e mode
        run: sh scripts/ci-metro.sh android
        working-directory: example
      # The emulator boots from a snapshot kept between runs (the emulator action's recommended setup)
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_7
      - name: Create the emulator and its boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Created the emulator's boot snapshot"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DEVICE: emulator-5554
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          # Animations stay on, as on a phone: with them off, Reanimated treats the device as reduced-motion
          disable-animations: false
          emulator-options:
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: example
          # Each line runs in its own shell. The flows run once more if they fail, as on iOS above
          script: |
            adb install -r expo-go.apk
            adb shell pm grant host.exp.exponent android.permission.POST_NOTIFICATIONS
            npm run e2e:android -- ${{ matrix.shard.flows }} || npm run e2e:android -- ${{ matrix.shard.flows }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-android-${{ matrix.shard.name }}
          path: |
            ~/.maestro/tests
            example/metro.log
