name: Native e2e
# The Maestro flows in example/e2e (all but the right-to-left ones, and landscape on iOS) on an iOS simulator and
# an Android emulator, in the example built as a release app of its own (scripts/e2e-build.sh): no Metro, no Expo
# Go. Each platform builds the app once; three groups of flows then run side by side on it.
# Caches: npm, the native builds (CocoaPods and Xcode's build folder, Gradle), Maestro, and the emulator's boot
# snapshot. A change in JavaScript only rebuilds the app's bundle. The build caches (about 1.4 GB each) are saved
# by main's runs only, so pull requests don't fill the repository's 10 GB of cache and evict the others; a cache
# key can't be overwritten, so each save's key ends in its run ID, and a run restores the newest match.
on:
  pull_request:
  # On main too: a pull request can only use caches saved by its own runs or by main's, so main's runs keep them
  # warm for every pull request
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: e2e-native-${{ github.ref }}
  cancel-in-progress: true
env:
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_VERSION: 2.11.0
  # The first start of Maestro's driver on a fresh simulator or emulator can be slow
  MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
  E2E_APP: build
  # A flow that fails runs once more (only the flows that failed): on the slow CI simulators a flow sometimes fails
  # on timing alone (a drag lands short, an app launch outlasts a wait) and passes the second time; a real failure
  # fails both times. Every run's Maestro output stays in ~/.maestro/tests for the artifact.
  E2E_RETRIES: 1
jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - run: npm --prefix example ci
      # The native build, under its native inputs: with them unchanged, Xcode rebuilds little more than the bundle
      # Under Xcode's version too: a build folder from another Xcode is no use. (ios/ and its Podfile.lock come from
      # expo prebuild, from these two files.)
      - run: echo "XCODE=$(xcodebuild -version | head -1 | tr -d ' ')" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@v4
        with:
          path: &ios-cache |
            example/ios/Pods
            example/ios/build
            ~/Library/Caches/CocoaPods
          key: ios-build-${{ env.XCODE }}-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-
          restore-keys: |
            ios-build-${{ env.XCODE }}-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-
            ios-build-${{ env.XCODE }}-
      - run: NO_INSTALL=1 sh scripts/e2e-build.sh ios
        working-directory: example
      - uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: *ios-cache
          key:
            ios-build-${{ env.XCODE }}-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-${{
            github.run_id }}
      # A tarball keeps the app's file modes, which an artifact's zip loses
      - run:
          tar -czf ListScrubber.app.tgz -C ios/build/Build/Products/Release-iphonesimulator ListScrubber.app
        working-directory: example
      - uses: actions/upload-artifact@v4
        with:
          name: ios-app
          path: example/ListScrubber.app.tgz
          retention-days: 3

  ios:
    name: ios (${{ matrix.shard.name }})
    needs: ios-build
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The flows in three groups that run side by side, of about equal length on CI
      matrix:
        shard:
          - name: lists
            flows: e2e/lists.yaml e2e/passthrough.yaml
          - name: drags
            flows: e2e/collapsible.yaml e2e/flatlist.yaml e2e/middle.yaml
          # Not landscape.yaml on iOS: after a rotation, GitHub's macOS simulator lost Maestro's touches in the
          # lower part of the screen, in that flow and the ones after it (they pass locally on the same simulator
          # model). It runs on Android here, and on iOS locally (npm run e2e:ios).
          - name: more
            flows: e2e/scrollview.yaml e2e/index.yaml e2e/accessibility.yaml e2e/large-text
    steps:
      - uses: actions/checkout@v7
      - name: Start booting an iPhone Pro simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[] | select(.key | test("iOS")) | .value[]
             | select(.name | test("^iPhone [0-9]+ Pro$"))] | last | .udid')
          echo "Simulator: $udid"
          xcrun simctl boot "$udid"
          echo "MAESTRO_DEVICE=$udid" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/cache@v4
        id: maestro-cache
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: ios-app
          path: example
      - name: Install the app
        run: |
          tar -xzf ListScrubber.app.tgz
          xcrun simctl bootstatus "$MAESTRO_DEVICE" -b
          xcrun simctl install "$MAESTRO_DEVICE" ListScrubber.app
        working-directory: example
      - run: sh scripts/e2e.sh ios ${{ matrix.shard.flows }}
        working-directory: example
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-ios-${{ matrix.shard.name }}
          path: ~/.maestro/tests

  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: example/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm --prefix example ci
      # Gradle's downloads and its build cache (e2e-build.sh builds with --build-cache), under the native inputs
      - uses: actions/cache/restore@v4
        with:
          path: &gradle-cache |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-gradle-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-
          restore-keys: |
            android-gradle-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-
            android-gradle-
      - run: NO_INSTALL=1 sh scripts/e2e-build.sh android
        working-directory: example
        env:
          # The CI emulator's architecture only
          ANDROID_ARCH: x86_64
      - uses: actions/cache/save@v4
        if: github.event_name == 'push'
        with:
          path: *gradle-cache
          key:
            android-gradle-${{ hashFiles('example/package-lock.json', 'example/app.json') }}-${{ github.run_id
            }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: example/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3

  android:
    name: android (${{ matrix.shard.name }})
    needs: android-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The flows in three groups that run side by side, of about equal length on CI
      matrix:
        shard:
          - name: lists
            flows: e2e/lists.yaml e2e/passthrough.yaml
          - name: drags
            flows: e2e/collapsible.yaml e2e/flatlist.yaml e2e/middle.yaml
          - name: more
            flows: e2e/landscape.yaml e2e/scrollview.yaml e2e/index.yaml e2e/accessibility.yaml e2e/large-text
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v4
        id: maestro-cache
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}
      - name: Install Maestro
        if: steps.maestro-cache.outputs.cache-hit != 'true'
        run: curl -fsSL https://get.maestro.mobile.dev | bash
      - run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: android-app
          path: example
      # The emulator boots from a snapshot kept between runs (the emulator action's recommended setup)
      - uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64-pixel_7
      - name: Create the emulator and its boot snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: echo "Created the emulator's boot snapshot"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_DEVICE: emulator-5554
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          force-avd-creation: false
          # Animations stay on, as on a phone: with them off, Reanimated treats the device as reduced-motion
          disable-animations: false
          emulator-options:
            -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: example
          # Each line runs in its own shell
          script: |
            adb install -r app-release.apk
            sh scripts/e2e.sh android ${{ matrix.shard.flows }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-android-${{ matrix.shard.name }}
          path: ~/.maestro/tests
