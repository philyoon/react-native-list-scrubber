name: Feature request
description: Suggest an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, and what's hard about it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: An API sketch or the behaviour you'd like. Optional.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
